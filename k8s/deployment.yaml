apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-calculator
  labels:
    app: student-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-calculator
  template:
    metadata:
      labels:
        app: student-calculator
    spec:
      containers:
      - name: student-calculator
        image: tanp77/student-calculator:446ab779678c284b66aa6dbdfd4ccf5030236eec
        ports:
        - containerPort: 5000
