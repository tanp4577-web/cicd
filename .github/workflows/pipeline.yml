name: DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Source Code Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 2. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 3. Continuous Integration (Run Tests)
      run: |
        python -m pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 4. Build and Push Docker Image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-calculator:$IMAGE_TAG .
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-calculator:$IMAGE_TAG

    - name: 5. Deployment Setup (K8s Manifest Update)
      run: |
        IMAGE_TAG=${{ github.sha }}
        sed -i "s/DOCKERHUB_USERNAME/${{ secrets.DOCKER_HUB_USERNAME }}/g" k8s/deployment.yaml
        sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" k8s/deployment.yaml
        
    - name: Simulate Kubernetes Deployment
      run: |
        echo "Applying manifests to cluster..."
        cat k8s/deployment.yaml
        cat k8s/service.yaml
